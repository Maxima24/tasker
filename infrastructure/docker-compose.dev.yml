# Dev dependencies only — Postgres + Redis. The apps run on the host via pnpm.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tasker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tasker
      POSTGRES_USER: tasker
      POSTGRES_PASSWORD: tasker
    ports: ["5433:5432"]
    volumes: [tasker_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasker -d tasker"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: tasker-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6380:6379"]
    volumes: [tasker_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tasker_pg:
  tasker_redis:
