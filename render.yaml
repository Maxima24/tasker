# Tasker on Render's free tier. No payment details needed.
#
#   tasker        ONE free web service running the tasker app and console, the
#                 API behind them, the Telegram bot, and a small in-memory Redis
#                 they share. One service because Render gives a workspace 750
#                 free hours a month (enough for exactly one service awake all
#                 month) and allows only one free Key Value instance. Kept awake
#                 by .github/workflows/keep-alive.yml.
#
# The database is NOT on Render: Render deletes free databases after 30 days.
# Create a free Postgres on neon.com (region: AWS Europe Central, Frankfurt)
# and paste its connection string as DATABASE_URL.
#
# Settings marked `sync: false` are asked for when the Blueprint is created.

services:
  - type: web
    name: tasker
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./infrastructure/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Neon > your project > Connect: the connection string, starting
      # postgresql:// and ending ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Generated once by Render. VAULT_KEY_SECRET encrypts every stored account
      # password: copy it somewhere safe, and never change or delete it.
      - key: JWT_SECRET
        generateValue: true
      - key: VAULT_KEY_SECRET
        generateValue: true
      - key: INTERNAL_API_SECRET
        generateValue: true

      # The first admin, created on first start while no admin exists. They
      # choose their own password on first sign-in.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # Telegram: the token from @BotFather, and the bot's username without @.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false

      # Cloudflare R2. Without these, video and screenshot uploads are refused.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Optional: a separate PRIVATE bucket for proof screenshots.
      - key: R2_PROOF_BUCKET
        sync: false

      # Push notifications. Generate with: npx web-push generate-vapid-keys
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:admin@tasker.dev
